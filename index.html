<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <script>
        if (sessionStorage.getItem("websiteEntered") === "true") {
            document.documentElement.classList.add("already-entered");
        }
    </script>

    <style>
        .already-entered .entrance-screen {
            display: none !important;
        }
    </style>

    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>

<header>
    <h1 class="site-title">personal website</h1>

    <p class="site-subtitle">
        notes / projects / miscellaneous things
    </p>
<button id="audio-button"
        class="bgm-button"
        type="button"
        title="BGM ON / OFF">

    <img id="audio-icon"
         src="images/speaker.png"
         alt="BGM ON">

</button>
</header>

<nav>
    <a href="index.html">HOME</a> <a href="about.html">ABOUT</a> <a href="projects.html">PROJECTS</a>
</nav>

<main>

    <div id="entrance-screen" class="entrance-screen">

        <div class="entrance-box">

            <div class="entrance-title">
                WEBSITE BOMBA
            </div>

            <button id="entrance-button"
                    class="entrance-button"
                    type="button">
                ENTER
            </button>

            <div class="entrance-note">
                sound will play
            </div>

        </div>

    </div>

    <div class="outside-image outside-image-left">
        
        <div class="home-side-image">
            <img
                class="blink-image"
                src="images/home-left.jpg"
                alt="left image"
                data-blink="true"
                data-visible="12.0"
                data-hidden="0.5">
        </div>

    </div>

    <div class="outside-image outside-image-right">
        
        <div class="home-side-image">
            <img
                class="blink-image"
                src="images/home-right.jpg"
                alt="right image"
                data-blink="true"
                data-visible="12.0"
                data-hidden="0.5">
        </div>

    </div>

    <h2 class="page-heading">HOME</h2>

    <article class="entry">

        <div class="entry-date">
            2026.08.30
        </div>

        <h3 class="entry-title">
            Hello!
        </h3>

        <p>SON</p>

    </article>

    <hr>

    <div class="small">
        last updated:
        2026.08.30
    </div>

    <audio id="bgm" loop>
    <source src="audio/home.mp3"
            type="audio/mpeg">
    </audio>

</main>

<footer>
    personal website
</footer>

<script src="js/audio.js"></script>

<script src="js/blink.js"></script>
<script src="js/entrance.js"></script>
</body>
</html>
